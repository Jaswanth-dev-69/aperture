<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product — Aperture Practice Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><a class="brand" href="index.html">Aperture<span>Shop</span></a></header>
  <main>
    <h1 id="product-name">Product</h1>
    <p class="subtitle" id="product-price"></p>

    <div class="card">
      <label for="qty">Quantity</label>
      <select id="qty" name="qty">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>

      <div class="actions">
        <a class="btn" id="add-to-cart" href="#">Add to cart</a>
        <a class="btn secondary" href="index.html">Back to shop</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const item = params.get("item") || "Mystery Item";
    const price = params.get("price") || "0.00";
    document.getElementById("product-name").textContent = item;
    document.getElementById("product-price").textContent = "$" + price + " each";

    // A plain, real anchor href — kept in sync with the quantity picker — so
    // "Add to cart" is a genuine link navigation, not a JS-driven redirect.
    const cartLink = document.getElementById("add-to-cart");
    const qtySelect = document.getElementById("qty");
    function updateCartLink() {
      cartLink.href =
        "cart.html?item=" + encodeURIComponent(item) + "&price=" + encodeURIComponent(price) + "&qty=" + qtySelect.value;
    }
    qtySelect.addEventListener("change", updateCartLink);
    updateCartLink();
  </script>
</body>
</html>
