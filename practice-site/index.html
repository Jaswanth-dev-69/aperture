<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aperture Practice Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><a class="brand" href="index.html">Aperture<span>Shop</span></a></header>
  <main>
    <h1>Practice Shop</h1>
    <p class="subtitle">
      A fake, offline store for testing Aperture macros. Nothing here is real — record
      a macro that browses, adds an item, and checks out, then replay it.
    </p>

    <div class="card product-list">
      <div class="product">
        <div>
          <div class="product-name">Mechanical Keyboard</div>
          <div class="product-price">$89.00</div>
        </div>
        <a class="btn" href="product.html?item=Mechanical+Keyboard&price=89.00" id="buy-keyboard">View</a>
      </div>
      <div class="product">
        <div>
          <div class="product-name">Ultrawide Monitor</div>
          <div class="product-price">$429.00</div>
        </div>
        <a class="btn" href="product.html?item=Ultrawide+Monitor&price=429.00" id="buy-monitor">View</a>
      </div>
      <div class="product">
        <div>
          <div class="product-name">USB-C Dock</div>
          <div class="product-price">$59.00</div>
        </div>
        <a class="btn" href="product.html?item=USB-C+Dock&price=59.00" id="buy-dock">View</a>
      </div>
    </div>
  </main>
</body>
</html>
